<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Login</title>
<link rel="stylesheet" href="../css/login.css">
</head>
<body>
	<div class="Card-login">
		<h2 class="Login-title">Login</h2>

		<form class="form-inputs" method="post">
			<div class="field">
				<label for="email">Email</label> <input type="email" id="email"
					name="email" placeholder="seuemail@gmail.com" required>
			</div>

			<div class="field">
				<label for="senha">Senha</label> <input type="password" id="senha"
					name="senha" placeholder="Digite sua senha" required>
			</div>

			<button type="submit">Acessar sistema</button>

			<div>
				<a href="../../../site/html/index.html">Voltar</a> <a
					id="esqueciSenha">Esqueci minha senha</a>
			</div>
		</form>
	</div>
	<script src="../Login/login.js"></script>
</body>
</html>
